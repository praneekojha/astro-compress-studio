<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroPress - Media Processing</title>

  <!-- Open Graph & Social Media Sharing Meta Tags (Shows Logo on Share Links) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yourwebsite.com/">
  <meta property="og:title" content="AstroPress - High Quality Video Processing">
  <meta property="og:description" content="Compress and scale your videos up to 4K without losing FPS.">
  <meta property="og:image" content="https://yourwebsite.com/logo.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://yourwebsite.com/">
  <meta name="twitter:title" content="AstroPress - Video Compressor">
  <meta name="twitter:description" content="Compress and scale videos seamlessly.">
  <meta name="twitter:image" content="https://yourwebsite.com/logo.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Load FFmpeg.wasm Library for Browser-Side Video Processing -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="logo.png" alt="AstroPress Logo" class="app-logo">
      <h2>AstroPress</h2>
    </div>

    <!-- Media Input -->
    <div class="form-group">
      <label for="videoInput">Select Video or Photo:</label>
      <input type="file" id="videoInput" accept="video/*,image/*">
    </div>

    <!-- Video Preview -->
    <video id="previewVideo" controls style="display:none;"></video>

    <!-- Resolution Selector (4K, 2K, 1080p, 720p) -->
    <div class="form-group">
      <label for="resolutionSelect">Resolution (never upscales):</label>
      <select id="resolutionSelect">
        <option value="2160">4K (2160p)</option>
        <option value="1440">2K (1440p)</option>
        <option value="1080" selected>1080p</option>
        <option value="720">720p</option>
      </select>
    </div>

    <!-- CRF Slider -->
    <div class="form-group">
      <label for="crfRange">Quality: CRF (<span id="crfValue">18</span>)</label>
      <input type="range" id="crfRange" min="16" max="28" value="18">
      <small>16–18 near-lossless, 20–23 balanced, 26+ smallest size.</small>
    </div>

    <button id="compressBtn">Process & Compress Video</button>

    <!-- Status & Error Output -->
    <div id="statusMessage" class="status" style="display:none;"></div>

    <!-- Download Output -->
    <div id="downloadContainer" style="display:none; margin-top: 15px;">
      <a id="downloadBtn" href="#" download="compressed_astropress.mp4">Download Output Video</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
